name: "Release to DockerHub"
description: "Republish a Docker Image, with a known SHA, from Apollo's internal repositories to DockerHub"
inputs:
  image_name:
    description: 'The name of the Docker Image that is to be built'
    required: true
  commit_sha:
    description: "The commit SHA of the image to re-publish"
    required: true
  version_number:
    description: "Primary version tag to apply. Either this or `tags` must be provided."
    required: false
    default: ""
  tag_latest:
    description: "When `version_number` is set, also apply the :latest tag. Ignored when only `tags` is set. Defaults to 'true' for backwards compatibility; set to 'false' for prereleases so :latest keeps pointing at the most recent stable."
    required: false
    default: "true"
  annotations:
    description: |
      Newline-separated list of annotations to apply to the released image
      index, each as `key=value` (for example a legal-notice annotation).
      Applied with `docker buildx imagetools create --annotation "index:..."`.
      Optional.
    required: false
    default: ""
  tags:
    description: |
      Newline-separated list of tag patterns in `docker/metadata-action` syntax (e.g. `type=raw,value=...`, `type=semver,pattern=...`). When set, these are added to whatever `version_number`/`tag_latest` produce; if both are empty the action fails. See https://github.com/docker/metadata-action for syntax.
    required: false
    default: ""
outputs:
  digest:
    description: "The manifest digest (sha256:...) of the published image. All applied tags point at this manifest."
    value: ${{ steps.publish.outputs.digest }}

runs:
  using: composite
  steps:
    # Annoyingly there's no global 'env' block available in composite actions and as such we have to use this
    # workaround. If there's any other environment variables we need, we should update this block.
    #
    # See: https://github.com/orgs/community/discussions/51280 for more details
    - name: "Setup Workflow Variables"
      id: globals
      shell: bash
      run: |
        BASE_ARTIFACT_REGISTRY_NAME=us-central1-docker.pkg.dev
        PUBLISHING_SERVICE_ACCOUNT_PROJECT_ID=platform-mgmt-service-e0izz

        echo "APOLLO_ARTIFACT_REGISTRY=${BASE_ARTIFACT_REGISTRY_NAME}/platform-cross-environment/apollo-private-docker" >> "${GITHUB_OUTPUT}"
        echo "BASE_ARTIFACT_REGISTRY_NAME=${BASE_ARTIFACT_REGISTRY_NAME}" >> "${GITHUB_OUTPUT}"

        # This project/service account are provisioned in apollo-terraform. In the longer term we should move
        # this to somewhere we control, but that should be in line with us owning an internal publishing repository
        echo "PUBLISHING_SERVICE_ACCOUNT_PROJECT_ID=${PUBLISHING_SERVICE_ACCOUNT_PROJECT_ID}" >> "${GITHUB_OUTPUT}"
        echo "PUBLISHING_SERVICE_ACCOUNT_NAME=release-tooling-automation@${PUBLISHING_SERVICE_ACCOUNT_PROJECT_ID}.iam.gserviceaccount.com" >> "${GITHUB_OUTPUT}"
        echo "WORKLOAD_IDENTITY_PROVIDER=projects/865738624352/locations/global/workloadIdentityPools/github-d8bck/providers/github-d8bck" >> "${GITHUB_OUTPUT}"
    - name: Authenticate With GCP
      id: gcp-auth
      uses: 'google-github-actions/auth@fc2174804b84f912b1f6d334e9463f484f1c552d'
      with:
        token_format: 'access_token'
        project_id: "${{ steps.globals.outputs.PUBLISHING_SERVICE_ACCOUNT_PROJECT_ID }}"
        service_account: "${{ steps.globals.outputs.PUBLISHING_SERVICE_ACCOUNT_NAME }}"
        workload_identity_provider: "${{ steps.globals.outputs.WORKLOAD_IDENTITY_PROVIDER }}"
    - name: Authenticate With Internal Repository
      id: docker-auth
      uses: 'docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef'
      with:
        username: 'oauth2accesstoken'
        password: '${{ steps.gcp-auth.outputs.access_token }}'
        registry: '${{ steps.globals.outputs.BASE_ARTIFACT_REGISTRY_NAME }}'
    - name: Fetch DockerHub Credential
      id: fetch-dockerhub-credential
      uses: google-github-actions/get-secretmanager-secrets@50ec04d56ddf2740b0bde82926cc742f90e06d2b
      with:
        secrets: |-
          token:platform-prod-service-q8dyj/docker_hub_push_token
    - name: Docker Auth
      uses: 'docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef'
      with:
        username: 'apollograph'
        password: '${{ steps.fetch-dockerhub-credential.outputs.token }}'
    - name: "Resolve tags"
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
      with:
        images: "apollograph/${{ inputs.image_name }}"
        tags: |
          ${{ inputs.version_number != '' && format('type=raw,value={0}', inputs.version_number) || '' }}
          ${{ (inputs.version_number != '' && inputs.tag_latest == 'true') && 'type=raw,value=latest' || '' }}
          ${{ inputs.tags }}
    - name: "Retag and push image to DockerHub"
      id: publish
      shell: bash
      env:
        META_TAGS: ${{ steps.meta.outputs.tags }}
        INDEX_ANNOTATIONS: ${{ inputs.annotations }}
      run: |
        args=()
        while IFS= read -r tag; do
          [[ -z "$tag" ]] && continue
          args+=( -t "$tag" )
        done <<< "$META_TAGS"
        if [[ ${#args[@]} -eq 0 ]]; then
          echo "::error::No tags resolved. Provide version_number, tags, or both." >&2
          exit 1
        fi
        while IFS= read -r ann; do
          [[ -z "$ann" ]] && continue
          args+=( --annotation "index:$ann" )
        done <<< "$INDEX_ANNOTATIONS"
        SOURCE="${{ steps.globals.outputs.APOLLO_ARTIFACT_REGISTRY }}/${{ inputs.image_name }}:${{ inputs.commit_sha }}"
        docker buildx imagetools create "${args[@]}" "$SOURCE"
        # All applied tags point at the same manifest; inspect the first to get its digest.
        FIRST_TAG="${args[1]}"
        DIGEST=$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{.Manifest.Digest}}')
        echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
    # Drop credentials before returning control to the caller. Otherwise
    # a push-scoped DockerHub token would still be loaded for any subsequent
    # docker invocations in the same job.
    - name: "Log out of registries"
      if: always()
      shell: bash
      run: |
        docker logout ${{ steps.globals.outputs.BASE_ARTIFACT_REGISTRY_NAME }} || true
        docker logout || true
