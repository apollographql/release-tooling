name: Build Image

on:
  workflow_call:
    inputs:
      additional_tags:
        description: "Newline-separated extra entries appended to docker/metadata-action's `tags:` list (e.g. `type=raw,value=0.0.0_{{sha}},enable={{is_default_branch}}`)."
        type: string
        required: false
        default: ""
      build_args:
        description: "Newline-separated list of build args to pass to docker build"
        type: string
        required: false
        default: ""
      buildkit_cache_hash_files:
        description: "Glob pattern passed to hashFiles() for cache busting (e.g. '**/Cargo.lock'). Used after checkout inside the reusable workflow."
        type: string
        required: false
        default: ""
      buildkit_cache_key:
        description: "Cache key prefix for buildkit-cache-dance (e.g. 'cargo-cache'). Platform slug and a hash of buildkit_cache_hash_files are appended automatically. Required if buildkit_cache_hash_files is set."
        type: string
        required: false
        default: ""
      context:
        description: "The path to the context that should be used to build the Docker Image"
        type: string
        required: true
      dockerfile_location:
        description: "The path to the Dockerfile that is to be built"
        type: string
        required: true
      image_description:
        description: "A description of the image being built"
        type: string
        required: true
      image_name:
        description: "The name of the Docker Image that is to be built"
        type: string
        required: true
      platforms:
        description: "JSON array of {platform, runner} objects"
        type: string
        required: false
        default: '[{"platform":"linux/amd64","runner":"ubuntu-latest"}]'
    secrets:
      docker_build_secrets:
        description: "A list of secrets to pass through to the Docker builder (e.g. 'registry_token=secret_value')"
        required: false

jobs:
  build:
    name: "Build ${{ inputs.image_name }} (${{ matrix.platform }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    steps:
      - name: Compute platform slug
        id: slug
        run: echo "platform=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Checkout Code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Set up Docker Buildx
        id: setup_buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Cache buildkit mount contents
        id: buildkit_cache
        if: inputs.buildkit_cache_key != ''
        uses: actions/cache@v4
        with:
          key: ${{ steps.slug.outputs.platform }}-${{ inputs.buildkit_cache_key }}-${{ inputs.buildkit_cache_hash_files != '' && hashFiles(inputs.buildkit_cache_hash_files) || 'default' }}
          path: buildkit-cache
          restore-keys: |
            ${{ steps.slug.outputs.platform }}-${{ inputs.buildkit_cache_key }}-

      - name: Inject buildkit cache mounts
        if: inputs.buildkit_cache_key != ''
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup_buildx.outputs.name }}
          cache-dir: buildkit-cache
          dockerfile: ${{ inputs.dockerfile_location }}
          skip-extraction: ${{ steps.buildkit_cache.outputs.cache-hit }}

      - name: Build Docker Image
        uses: docker/build-push-action@64c9b141502b80dbbd71e008a0130ad330f480f8
        with:
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha,scope=${{ matrix.platform }}-build
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}-build
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile_location }}
          labels: |
            org.opencontainers.image.title=${{ inputs.image_name }}
            org.opencontainers.image.description=${{ inputs.image_description }}
            org.opencontainers.image.vendor=Apollo GraphQL
          outputs: type=docker,dest=${{ runner.temp }}/${{ inputs.image_name }}.tar
          platforms: ${{ matrix.platform }}
          push: false
          secrets: ${{ secrets.docker_build_secrets }}

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          # Double-dash separates image_name from platform slug because `--`
          # is not a valid sequence in a Docker image name, so the manifest
          # job's glob can't prefix-match a longer image name (e.g. building
          # both `foo` and `foo-bar` in the same parent workflow).
          name: image-${{ inputs.image_name }}--${{ steps.slug.outputs.platform }}
          path: ${{ runner.temp }}/${{ inputs.image_name }}.tar
          retention-days: 1
