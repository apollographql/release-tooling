name: "Run Known RTF Test Plan"

description: "Run a known RTF test plan using the Orchestrator"

inputs:
  git_ref:
    description: "Optional git ref to pull the test plan from (defaults to mainline if unset)"
  test_plan_id:
    description: "The Orchestrator ID for the test plan you want to run"
    required: true
  vars_file:
    description: "Path to a JSON file containing template variables"

outputs: {}

runs:
  using: composite
  steps:
    # Annoyingly there's no global 'env' block available in composite actions and as such we have to use this
    # workaround. If there's any other environment variables we need, we should update this block.
    #
    # See: https://github.com/orgs/community/discussions/51280 for more details
    - name: "Setup Workflow Variables"
      id: globals
      run: |
        BASE_ARTIFACT_REGISTRY_NAME=us-central1-docker.pkg.dev
        PUBLISHING_SERVICE_ACCOUNT_PROJECT_ID=platform-mgmt-service-e0izz

        echo "APOLLO_ARTIFACT_REGISTRY=${BASE_ARTIFACT_REGISTRY_NAME}/platform-cross-environment/apollo-private-docker" >> "${GITHUB_OUTPUT}"
        echo "BASE_ARTIFACT_REGISTRY_NAME=${BASE_ARTIFACT_REGISTRY_NAME}" >> "${GITHUB_OUTPUT}"

        # This project/service account are provisioned in apollo-terraform. In the longer term we should move
        # this to somewhere we control, but that should be in line with us owning an internal publishing repository
        echo "PUBLISHING_SERVICE_ACCOUNT_PROJECT_ID=${PUBLISHING_SERVICE_ACCOUNT_PROJECT_ID}" >> "${GITHUB_OUTPUT}"
        echo "PUBLISHING_SERVICE_ACCOUNT_NAME=release-tooling-automation@${PUBLISHING_SERVICE_ACCOUNT_PROJECT_ID}.iam.gserviceaccount.com" >> "${GITHUB_OUTPUT}"
        echo "WORKLOAD_IDENTITY_PROVIDER=projects/865738624352/locations/global/workloadIdentityPools/github-d8bck/providers/github-d8bck" >> "${GITHUB_OUTPUT}"

        # RTF project WIF — used to produce external_account credentials that the RTF CLI
        # exchanges for an IAM-signed JWT to authenticate with the IAP-protected orchestrator.
        # release-tooling-rtf is scoped specifically to this action (WIF trust follows
        # apollo-terraform's release-tooling enrolled_repos list).
        echo "RTF_WORKLOAD_IDENTITY_PROVIDER=projects/230145797925/locations/global/workloadIdentityPools/github-actions/providers/apollographql" >> "${GITHUB_OUTPUT}"
        echo "RTF_SERVICE_ACCOUNT=release-tooling-rtf@runtime-testing-framework.iam.gserviceaccount.com" >> "${GITHUB_OUTPUT}"
      shell: bash

    - name: Authenticate With GCP
      id: gcp_auth
      uses: "google-github-actions/auth@fc2174804b84f912b1f6d334e9463f484f1c552d"
      with:
        create_credentials_file: false
        project_id: "${{ steps.globals.outputs.PUBLISHING_SERVICE_ACCOUNT_PROJECT_ID }}"
        service_account: "${{ steps.globals.outputs.PUBLISHING_SERVICE_ACCOUNT_NAME }}"
        token_format: "access_token"
        workload_identity_provider: "${{ steps.globals.outputs.WORKLOAD_IDENTITY_PROVIDER }}"

    - name: Authenticate With RTF GCP Project
      id: rtf_gcp_auth
      uses: "google-github-actions/auth@fc2174804b84f912b1f6d334e9463f484f1c552d"
      with:
        create_credentials_file: true
        project_id: "runtime-testing-framework"
        service_account: "${{ steps.globals.outputs.RTF_SERVICE_ACCOUNT }}"
        workload_identity_provider: "${{ steps.globals.outputs.RTF_WORKLOAD_IDENTITY_PROVIDER }}"

    - name: Authenticate With Internal Repository
      id: docker_auth
      uses: "docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef"
      with:
        password: ${{ steps.gcp_auth.outputs.access_token }}
        registry: "${{ steps.globals.outputs.BASE_ARTIFACT_REGISTRY_NAME }}"
        username: "oauth2accesstoken"

    # Test plans commonly reference other repos (e.g. `kind: github` file/scenario providers
    # pulling shared config from apollographql/rtf-morgue), which the rtf CLI resolves itself
    # before it ever talks to the Orchestrator. That resolution needs its own GitHub client, so
    # we mint a short-lived installation token from a GitHub App key dedicated to this action -
    # separate from the App ArgoCD and the orchestrator server share - rather than requiring
    # every caller of this action to supply a GITHUB_TOKEN of their own.
    - name: Fetch GitHub App Credentials
      id: github_app_secrets
      uses: "google-github-actions/get-secretmanager-secrets@50ec04d56ddf2740b0bde82926cc742f90e06d2b"
      with:
        secrets: |-
          app_id:runtime-testing-framework/github-app-id
          private_key:runtime-testing-framework/github-app-private-key

    - name: Mint GitHub App Installation Token
      id: github_app_token
      uses: "actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1"
      with:
        app-id: ${{ steps.github_app_secrets.outputs.app_id }}
        owner: "${{ github.repository_owner }}"
        private-key: ${{ steps.github_app_secrets.outputs.private_key }}

    - name: Run Test Plan
      run: |
        docker pull "${RTF_IMAGE}"

        # Build rtf arguments conditionally
        RTF_ARGS=()
        if [[ -n "${{ inputs.vars_file }}" ]]; then
          RTF_ARGS+=("--vars" "${{ inputs.vars_file }}")
        fi
        if [[ -n "${{ inputs.git_ref }}" ]]; then
          RTF_ARGS+=("--ref" "${{ inputs.git_ref }}")
        fi

        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
          -v "${RTF_CREDENTIALS_FILE}:${RTF_CREDENTIALS_FILE}" \
          -e GOOGLE_APPLICATION_CREDENTIALS="${RTF_CREDENTIALS_FILE}" \
          -e GITHUB_TOKEN="${GITHUB_APP_TOKEN}" \
          -w "${GITHUB_WORKSPACE}" \
          "${RTF_IMAGE}" \
          rtf remote ci-run-known "${RTF_ARGS[@]}" "${{ inputs.test_plan_id }}"
      env:
        RTF_IMAGE: ${{ steps.globals.outputs.APOLLO_ARTIFACT_REGISTRY }}/rtf-toolbox:edge
        RTF_CREDENTIALS_FILE: ${{ steps.rtf_gcp_auth.outputs.credentials_file_path }}
        GITHUB_APP_TOKEN: ${{ steps.github_app_token.outputs.token }}
      shell: bash
